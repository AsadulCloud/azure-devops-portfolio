<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
  <defs>
    <style>
      .title { font: 700 32px DejaVu Sans, Arial, sans-serif; fill: #1e3a5f; }
      .h { font: 700 16px DejaVu Sans, Arial, sans-serif; fill: #1e3a5f; }
      .sub { font: 13px DejaVu Sans, Arial, sans-serif; fill: #64748b; }
      .small { font: 12px DejaVu Sans, Arial, sans-serif; fill: #64748b; }
      .label { font: 11px DejaVu Sans, Arial, sans-serif; fill: #2563eb; }
      .prom { font: 700 28px DejaVu Sans, Arial, sans-serif; fill: #e85d04; }
      .promsub { font: 14px DejaVu Sans, Arial, sans-serif; fill: #64748b; }
      .orange { font: 700 16px DejaVu Sans, Arial, sans-serif; fill: #e85d04; }
      .red { font: 700 16px DejaVu Sans, Arial, sans-serif; fill: #dc2626; }
      .legend { font: 12px DejaVu Sans, Arial, sans-serif; fill: #94a3b8; }
    </style>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#e85d04"/>
    </marker>
  </defs>

  <rect width="1200" height="780" fill="#ffffff"/>

  <text x="600" y="42" text-anchor="middle" class="title">Observability Stack on AKS</text>

  <rect x="40" y="70" width="1120" height="160" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="60" y="98" class="h">1  Applications & Cluster</text>

  <rect x="80" y="115" width="300" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="80" y="115" width="6" height="90" rx="2" fill="#2563eb"/>
  <text x="230" y="150" text-anchor="middle" class="h">Apps</text>
  <text x="230" y="170" text-anchor="middle" class="sub">(service-a, service-b)</text>
  <text x="230" y="188" text-anchor="middle" class="small">custom metrics</text>

  <rect x="450" y="115" width="300" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="450" y="115" width="6" height="90" rx="2" fill="#0d9488"/>
  <text x="600" y="150" text-anchor="middle" class="h">Node Exporter</text>
  <text x="600" y="170" text-anchor="middle" class="sub">hardware metrics</text>
  <text x="600" y="188" text-anchor="middle" class="small">CPU, memory, disk</text>

  <rect x="820" y="115" width="300" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="820" y="115" width="6" height="90" rx="2" fill="#2563eb"/>
  <text x="970" y="150" text-anchor="middle" class="h">kube-state-metrics</text>
  <text x="970" y="170" text-anchor="middle" class="sub">Kubernetes objects</text>
  <text x="970" y="188" text-anchor="middle" class="small">pods, restarts</text>

  <line x1="230" y1="205" x2="230" y2="280" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="248" y="250" class="label">scrape</text>
  <line x1="600" y1="205" x2="600" y2="280" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="618" y="250" class="label">scrape</text>
  <line x1="970" y1="205" x2="970" y2="255" stroke="#2563eb" stroke-width="2"/>
  <path d="M970,255 Q970,290 780,290" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="900" y="248" class="label">scrape</text>

  <rect x="320" y="290" width="480" height="100" rx="16" fill="#fff7ed" stroke="#e85d04" stroke-width="2.5"/>
  <text x="560" y="335" text-anchor="middle" class="prom">Prometheus</text>
  <text x="560" y="365" text-anchor="middle" class="promsub">collects & stores metrics</text>

  <line x1="800" y1="340" x2="900" y2="340" stroke="#e85d04" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <text x="830" y="328" class="label" style="fill:#e85d04">dashboards</text>

  <rect x="910" y="305" width="200" height="70" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1010" y="335" text-anchor="middle" class="orange">Grafana</text>
  <text x="1010" y="355" text-anchor="middle" class="small">dashboards</text>

  <line x1="560" y1="390" x2="560" y2="450" stroke="#e85d04" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <text x="575" y="425" class="label" style="fill:#e85d04">alerts</text>

  <rect x="380" y="460" width="280" height="70" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="520" y="490" text-anchor="middle" class="h">Alertmanager</text>
  <text x="520" y="510" text-anchor="middle" class="small">routes & groups alerts</text>

  <line x1="660" y1="495" x2="800" y2="495" stroke="#e85d04" stroke-width="2.5" marker-end="url(#arrowOrange)"/>

  <rect x="810" y="460" width="180" height="70" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="900" y="490" text-anchor="middle" class="red">Email</text>
  <text x="900" y="510" text-anchor="middle" class="small">Gmail notifications</text>

  <rect x="40" y="580" width="1120" height="90" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="630" class="h">NGINX Ingress</text>

  <rect x="280" y="605" width="160" height="40" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="360" y="630" text-anchor="middle" class="h" style="fill:#2563eb;font-size:14px">Grafana</text>

  <rect x="470" y="605" width="160" height="40" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="550" y="630" text-anchor="middle" class="h" style="fill:#2563eb;font-size:14px">Prometheus</text>

  <rect x="660" y="605" width="160" height="40" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="740" y="630" text-anchor="middle" class="h" style="fill:#2563eb;font-size:14px">Alertmanager</text>

  <rect x="850" y="605" width="160" height="40" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="930" y="630" text-anchor="middle" class="h" style="fill:#2563eb;font-size:14px">Apps</text>

  <text x="40" y="720" class="legend">scrape metrics  →  query / alerts / access</text>
  <text x="40" y="745" class="legend">High-level view of the kube-prometheus-stack deployment on AKS</text>
</svg>
