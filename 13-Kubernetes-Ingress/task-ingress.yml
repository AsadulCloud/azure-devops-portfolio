---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: Port
  namespace: aks-cicd-app
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /hello
            pathType: Prefix
            backend:
              service:
                name: hello-app
                port:
                  number: 50