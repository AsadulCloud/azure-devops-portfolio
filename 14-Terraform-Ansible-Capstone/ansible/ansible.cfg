[defaults]
host_key_checking = False
# A brand-new VM's SSH host key has never been seen before. Without this
# setting, Ansible's first connection would pause waiting for an interactive
# "yes/no, trust this host?" prompt - which breaks a non-interactive pipeline.
# Fine for a learning project; in a stricter production setup you'd manage
# known_hosts explicitly instead of disabling this check globally.
retry_files_enabled = False