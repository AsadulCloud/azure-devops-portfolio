# notification-service pipeline - builds, pushes, and deploys ONLY notification-service.
# Matches the proven-working pattern from 10-Terraform-AKS-CICD.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - 12-Task-Manager-Microservices/notification-service/*
      - 12-Task-Manager-Microservices/k8s/notification-service.yaml

resources:
  - repo: self

variables:
- group: task-manager-shared     # pulls in acrLoginServer, aksClusterName, aksResourceGroup, namespace
# Docker Registry service connection (Basic Auth - the one confirmed working)
- name: dockerRegistryServiceConnection
  value: 'portfolioasadacr'
- name: imageRepository
  value: 'task-manager-api'
- name: dockerfilePath
  value: '12-Task-Manager-Microservices/notification-service/Dockerfile'
- name: tag
  value: '$(Build.BuildId)'
- name: imagePullSecret
  value: 'portfolioasadacr-task-manager-auth'
- name: vmImageName
  value: 'ubuntu-latest'
stages:
  - stage: Build
    displayName: Build stage
    jobs:
      - job: Build
        displayName: Build
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: Docker@2
            displayName: Build and push notification-service image
            inputs:
              command: buildAndPush
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              buildContext: '12-Task-Manager-Microservices/notification-service'
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(tag)

          - upload: 12-Task-Manager-Microservices/k8s
            artifact: manifests

  - stage: Deploy
    displayName: Deploy stage
    dependsOn: Build
    jobs:
      - deployment: Deploy
        displayName: Deploy
        pool:
          vmImage: $(vmImageName)
        environment: 'task-manager'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: KubernetesManifest@1
                  displayName: Create imagePullSecret
                  inputs:
                    action: createSecret
                    secretName: $(imagePullSecret)
                    dockerRegistryEndpoint: $(dockerRegistryServiceConnection)
                    kubernetesServiceConnection: 'task-manager-portfolioasad-aks-task-manager'
                    namespace: '$(namespace)'

                - task: KubernetesManifest@1
                  displayName: Deploy notification-service
                  inputs:
                    action: deploy
                    kubernetesServiceConnection: 'task-manager-portfolioasad-aks-task-manager'
                    manifests: |
                      $(Pipeline.Workspace)/manifests/notification-service.yaml
                    imagePullSecrets: |
                      $(imagePullSecret)
                    containers: |
                      $(acrLoginServer)/$(imageRepository):$(tag)
