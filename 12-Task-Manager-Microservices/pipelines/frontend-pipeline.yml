# frontend pipeline - builds, pushes, and deploys ONLY frontend.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - 12-Task-Manager-Microservices/frontend/*
      - 12-Task-Manager-Microservices/k8s/frontend.yaml

resources:
  - repo: self

variables:
  - group: task-manager-shared
  - name: dockerRegistryServiceConnection
    value: 'portfolioasadacr'
  - name: imageRepository
    value: 'task-manager-frontend'
  - name: dockerfilePath
    value: '12-Task-Manager-Microservices/frontend/Dockerfile'
  - name: tag
    value: '$(Build.BuildId)'
  - name: imagePullSecret
    value: 'portfolioasadacr-task-manager-auth'
  - name: vmImageName
    value: 'ubuntu-latest'
  - name: manifestFile
    value: 'frontend.yaml'

stages:
  - stage: Build
    displayName: Build stage
    jobs:
      - job: Build
        displayName: Build
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: Docker@2
            displayName: Build and push frontend image
            inputs:
              command: buildAndPush
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              buildContext: '12-Task-Manager-Microservices/frontend'
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(tag)

          - upload: 12-Task-Manager-Microservices/k8s
            artifact: manifests

  - stage: Deploy
    displayName: Deploy stage
    dependsOn: Build
    jobs:
      - deployment: Deploy
        displayName: Deploy
        pool:
          vmImage: $(vmImageName)
        environment: 'task-manager'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: KubernetesManifest@1
                  displayName: Create imagePullSecret
                  inputs:
                    action: createSecret
                    secretName: $(imagePullSecret)
                    dockerRegistryEndpoint: $(dockerRegistryServiceConnection)
                    kubernetesServiceConnection: 'task-manager-portfolioasad-aks-task-manager'
                    namespace: '$(namespace)'

                - script: |
                    sed -i "s#$(acrLoginServer)/$(imageRepository):.*#$(acrLoginServer)/$(imageRepository):$(tag)#g" $(Pipeline.Workspace)/manifests/$(manifestFile)
                    echo "Final image line:"
                    grep image: $(Pipeline.Workspace)/manifests/$(manifestFile)
                  displayName: 'Inject real image tag into manifest'

                - task: KubernetesManifest@1
                  displayName: Deploy frontend
                  inputs:
                    action: deploy
                    kubernetesServiceConnection: 'task-manager-portfolioasad-aks-task-manager'
                    namespace: '$(namespace)'
                    manifests: |
                      $(Pipeline.Workspace)/manifests/$(manifestFile)
                    imagePullSecrets: |
                      $(imagePullSecret)