# frontend pipeline - builds, pushes, and deploys ONLY frontend.
# Matches the proven-working pattern from 10-Terraform-AKS-CICD.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - 12-Task-Manager-Microservices/frontend/*
      - 12-Task-Manager-Microservices/k8s/frontend.yaml

resources:
  - repo: self

variables:
- group: task-manager-shared     # pulls in acrLoginServer, aksClusterName, aksResourceGroup, namespace
# Docker Registry service connection (Basic Auth - the one confirmed working)
- name: dockerRegistryServiceConnection
  value: 'asadulcicdacr'
- name: imageRepository
  value: 'task-manager-api'
- name: dockerfilePath
  value: '12-Task-Manager-Microservices/api-service/Dockerfile'
- name: tag
  value: '$(Build.BuildId)'
- name: imagePullSecret
  value: 'asadulcicdacr-task-manager-auth'
- name: vmImageName
  value: 'ubuntu-latest'

stages:
  - stage: Build
    displayName: Build stage
    jobs:
      - job: Build
        displayName: Build
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: Docker@2
            displayName: Build and push frontend image
            inputs:
              command: buildAndPush
              repository: $(imageRepository)
              dockerfile: $(dockerfilePath)
              buildContext: '12-Task-Manager-Microservices/frontend'
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(tag)

          - upload: 12-Task-Manager-Microservices/k8s
            artifact: manifests

  - stage: Deploy
    displayName: Deploy stage
    dependsOn: Build
    jobs:
      - deployment: Deploy
        displayName: Deploy
        pool:
          vmImage: $(vmImageName)
        environment: 'task-manager'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: KubernetesManifest@0
                  displayName: Create imagePullSecret
                  inputs:
                    action: createSecret
                    secretName: $(imagePullSecret)
                    dockerRegistryEndpoint: $(dockerRegistryServiceConnection)
                    kubernetesServiceConnection: 'task-manager-asadulcicd-aks-task-manager-1784884434412'

                - task: KubernetesManifest@0
                  displayName: Deploy frontend
                  inputs:
                    action: deploy
                    kubernetesServiceConnection: 'task-manager-asadulcicd-aks-task-manager-1784884434412'
                    manifests: |
                      $(Pipeline.Workspace)/manifests/frontend.yaml
                    imagePullSecrets: |
                      $(imagePullSecret)
                    containers: |
                      $(acrLoginServer)/$(imageRepository):$(tag)
