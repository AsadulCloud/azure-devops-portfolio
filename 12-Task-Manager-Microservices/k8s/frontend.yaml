apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: portfolioasadacr.azurecr.io/task-manager-frontend:placeholder
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  # ClusterIP — public traffic enters via the shared NGINX Ingress Controller
  # (see 13-Kubernetes-Ingress/task-manager-ingress.yml).
  # Originally LoadBalancer; migrated to Ingress to avoid Azure public-IP quota limits
  # and to share one external IP across multiple apps on the same cluster.
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
